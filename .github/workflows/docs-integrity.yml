name: docs-integrity

# Every relative *.md link must resolve. A rename must not silently orphan references.
on:
  push:
    paths: ["**/*.md"]
  pull_request:
    paths: ["**/*.md"]

permissions:
  contents: read

jobs:
  relative-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative .md links resolve
        run: |
          set -u
          broken=0
          while IFS= read -r f; do
            dir=$(dirname "$f")
            while IFS= read -r link; do
              case "$link" in http*|mailto*) continue;; esac
              if [ ! -f "$dir/$link" ] && [ ! -f "$link" ]; then
                echo "BROKEN: $f -> $link"
                broken=1
              fi
            done < <(grep -oE '\]\(([^)#]+\.md)' "$f" 2>/dev/null | sed 's/](//')
          done < <(find . -name "*.md" \
                     -not -path "./.git/*" \
                     -not -path "./node_modules/*")
          exit $broken
