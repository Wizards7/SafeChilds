name: checks

# Typecheck + lint + tests + build on every push and PR.
# Postgres is provided for the backend integration tests; DB-backed tests skip themselves without DATABASE_URL.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safechilds
          POSTGRES_PASSWORD: safechilds
          POSTGRES_DB: safechilds
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U safechilds -d safechilds"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://safechilds:safechilds@localhost:5432/safechilds
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
