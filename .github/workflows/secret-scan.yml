name: secret-scan

# Every push and PR, full history — a secret in an old commit is still a leak.
# The repo will hold an Anthropic key and a Telegram bot token in .env files; one accidental commit is a leak.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
