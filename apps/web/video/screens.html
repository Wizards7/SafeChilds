<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SafeChilds video screens</title>
<!-- Phone-screen clips for the concept video. Open screens.html?s=dm|bubble|link|photo|share|message (360×780, record at 2×)
     or ?s=end (1920×1080). Add &frame=1 for a 16:9 version with the phone on the navy stage and a caption.
     Every animation is a CSS keyframe with a delay, so a recorder can pause them and step currentTime frame by frame.
     Result wording comes from the app (packages/analysis templates, apps/mobile/messages). Concept only: nothing is checked. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #0f172a; --slate: #475569; --mute: #94a3b8; --line: #e2e8f0; --bg: #f7f9fc; --blue: #2563eb; --red: #b91c1c;
  --navy: #0b1e45; --grass: #8ed462; --cream: #f5f1e4;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Inter, system-ui, sans-serif; color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased; overflow: hidden; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }

/* every animated thing starts from its "from" state and holds its "to" state */
.a { animation-duration: .5s; animation-timing-function: cubic-bezier(.22, 1, .36, 1); animation-fill-mode: both; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } 60% { opacity: 1; transform: scale(1.08); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes out { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
@keyframes tap { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes ping { 0% { opacity: .9; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dots { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
@keyframes press { 0%, 100% { transform: none; } 50% { transform: scale(.94); } }

/* ---------- the phone screen (360 × 780) ---------- */
.screen { position: relative; width: 360px; height: 780px; overflow: hidden; background: var(--bg); color: var(--ink); text-align: left; }
.status { position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 6px 28px 0; font-size: 15px; font-weight: 600; }
.status__isl { position: absolute; left: 50%; top: 11px; width: 108px; height: 30px; border-radius: 99px; background: #000; transform: translateX(-50%); }
.status__ic { display: flex; align-items: center; gap: 5px; }
.status__ic i { display: block; height: 11px; background: currentColor; border-radius: 2px; }
.status__ic i:nth-child(1) { width: 17px; clip-path: polygon(0 100%, 100% 0, 100% 100%); border-radius: 0; }
.status__ic i:nth-child(2) { width: 15px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
.status__ic i:nth-child(3) { width: 25px; border-radius: 4px; }
.tapdot { position: absolute; z-index: 30; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 255, 255, .55); border: 2px solid rgba(37, 99, 235, .8); opacity: 0; animation: tap .6s ease-out both; }

/* app chrome (SafeChilds look) */
.bar { display: flex; align-items: center; gap: 10px; padding: 6px 18px 12px; }
.bar b { flex: 1; font-size: 18px; font-weight: 700; }
.help { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 99px; border: 1px solid #fca5a5; background: #fef2f2; color: var(--red); font-size: 12.5px; font-weight: 600; }
.help .ic { width: 15px; height: 15px; }
.body { padding: 0 18px; display: flex; flex-direction: column; gap: 12px; }
.card { padding: 14px 15px; border-radius: 18px; background: #fff; border: 1px solid var(--line); }
.tier { padding: 13px 15px; border-radius: 18px; background: #fff7e6; border: 1px solid #f6d58e; }
.tier b { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
.tier b .ic { color: #b45309; }
.tier p { margin: 4px 0 0; color: var(--slate); font-size: 13px; line-height: 1.4; }
.h3 { margin: 4px 0 0; font-size: 16px; font-weight: 700; }
.find { display: flex; gap: 10px; padding: 11px 13px; border-radius: 15px; background: #fff; border: 1px solid var(--line); font-size: 12.5px; color: var(--slate); line-height: 1.38; }
.find b { display: block; color: var(--ink); font-size: 13.5px; font-weight: 700; }
.find .n { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #1e293b; color: #fff; font-size: 12px; font-weight: 700; }
.badge { margin-left: 4px; padding: 1px 7px; border-radius: 99px; background: #eef2f7; color: var(--slate); font-size: 10.5px; font-weight: 600; vertical-align: 1px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 14px; background: var(--blue); color: #fff; font-size: 15px; font-weight: 600; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--blue); animation: spin .8s linear infinite; }
.typing { display: inline-flex; gap: 4px; padding: 11px 14px; border-radius: 18px; background: #efefef; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #8e8e8e; animation: dots 1.1s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }

/* social look (DM + feed) */
.sbar { display: flex; align-items: center; gap: 10px; padding: 6px 16px 10px; border-bottom: 1px solid #efefef; background: #fff; }
.av { width: 34px; height: 34px; border-radius: 50%; background: url(../v2/assets/demo-face.jpg) center / cover; flex: none; }
.sbar b { display: block; font-size: 15px; font-weight: 600; }
.sbar small { color: #737373; font-size: 12px; }
.dm { position: absolute; inset: 46px 0 0; display: flex; flex-direction: column; background: #fff; }
.msgs { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 14px 14px 18px; }
.m { align-self: flex-start; max-width: 78%; padding: 10px 14px; border-radius: 20px 20px 20px 6px; background: #efefef; font-size: 15px; line-height: 1.35; }
.m--me { align-self: flex-end; border-radius: 20px 20px 6px 20px; background: #3797f0; color: #fff; }
.m--link { padding: 0; overflow: hidden; width: 230px; }
.m--link .pv { height: 120px; background: url(../v2/assets/demo-face.jpg) center 30% / cover; filter: blur(7px) saturate(.8); transform: scale(1.1); }
.m--link .lk { padding: 9px 12px 11px; }
.m--link .lk b { display: block; font-size: 13.5px; font-weight: 600; }
.m--link .lk span { color: #3797f0; font-size: 13px; }
.compose { display: flex; align-items: center; gap: 10px; margin: 0 12px 22px; padding: 10px 14px; border-radius: 99px; background: #efefef; color: #8e8e8e; font-size: 14px; }

/* floating button + panel */
.qbtn { position: absolute; z-index: 20; right: 12px; top: 470px; width: 52px; height: 52px; border-radius: 16px; background: rgba(28, 33, 44, .8); display: grid; place-items: center; }
.qbtn::before { content: ""; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.25); box-shadow: inset 0 0 0 5px rgba(255,255,255,.35), inset 0 0 0 9px rgba(28,33,44,.2), inset 0 0 0 16px rgba(255,255,255,.9); }
.qbtn::after { content: ""; position: absolute; inset: -6px; border-radius: 22px; border: 2px solid rgba(37, 99, 235, .85); animation: ping 1.8s ease-out infinite; }
.dim { position: absolute; z-index: 21; inset: 0; background: rgba(15, 23, 42, .4); opacity: 0; }
.panel {
  position: absolute; z-index: 22; left: 18px; right: 18px; top: 220px; height: 324px; padding: 18px 10px; border-radius: 34px; background: rgba(28, 33, 44, .95);
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); grid-template-areas: ". a ." "b . c" "d e f";
  transform-origin: 92% 82%; opacity: 0;
}
@keyframes grow { from { opacity: 0; transform: scale(.15); } to { opacity: 1; transform: none; } }
.it { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 18px; color: #fff; font-size: 13px; font-weight: 500; line-height: 1.15; text-align: center; }
.it .ic { width: 38px; height: 38px; stroke-width: 1.8; }
.it.is-hot { animation: hot .3s ease-out both; }
@keyframes hot { to { background: rgba(255, 255, 255, .14); } }
.homeb { width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255,255,255,.55), inset 0 0 0 6px rgba(28,33,44,.95), inset 0 0 0 40px #fff; }

/* feed + share sheet */
.feed { position: absolute; inset: 46px 0 0; display: flex; flex-direction: column; background: #fff; }
.feed__top { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 10px; }
.feed__top b { font-family: "Snell Roundhand", "Brush Script MT", cursive; font-size: 30px; font-weight: 600; }
.post__h { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 14px; }
.post__h b { font-weight: 600; } .post__h small { display: block; color: #737373; font-size: 11.5px; }
.post__img { width: 100%; aspect-ratio: 1; background: url(../v2/assets/demo-face.jpg) center / cover; }
.post__acts { display: flex; gap: 16px; padding: 10px 14px 6px; }
.post__acts .ic { width: 25px; height: 25px; stroke-width: 1.9; }
.post__cap { padding: 0 14px; font-size: 13.5px; } .post__cap b { font-weight: 600; }
.sheet { position: absolute; z-index: 22; left: 0; right: 0; bottom: 0; padding: 10px 16px 30px; border-radius: 26px 26px 0 0; background: #f2f2f7; transform: translateY(100%); }
@keyframes sheetin { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheetout { from { transform: none; } to { transform: translateY(100%); } }
.sheet__grab { width: 38px; height: 5px; margin: 0 auto 12px; border-radius: 3px; background: #c7c7cc; }
.sheet__t { margin: 0 0 14px; font-size: 15px; font-weight: 600; text-align: center; }
.apps { display: flex; justify-content: space-between; margin-bottom: 16px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 70px; font-size: 11.5px; color: #3a3a3c; }
.app i { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 15px; color: #fff; }
.app i .ic { width: 28px; height: 28px; }
.app i img { width: 58px; height: 58px; }
.app--sc i { animation: ringon .3s 2.5s both; }
@keyframes ringon { from { box-shadow: 0 0 0 0 #fff, 0 0 0 0 var(--blue); transform: none; } 50% { transform: scale(.92); } to { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--blue); transform: none; } }
.rows { border-radius: 14px; background: #fff; }
.rows div { display: flex; justify-content: space-between; padding: 13px 15px; border-bottom: 1px solid #e5e5ea; font-size: 15px; }
.rows div:last-child { border: 0; }

/* layered scenes inside one screen */
.layer { position: absolute; inset: 46px 0 0; display: flex; flex-direction: column; background: var(--bg); opacity: 0; }

/* chat with mum */
.chat { background: #fff; }
.chat .m--me { background: #3797f0; }
.ticks { align-self: flex-end; margin: -4px 4px 0 0; color: #3797f0; font-size: 11px; font-weight: 600; }

/* ---------- end card (1920 × 1080) ---------- */
.end { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: #fff; background: radial-gradient(120% 95% at 72% 0%, #1b4590 0%, #112f6b 38%, #0b1e45 72%, #08163a 100%); display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 0 200px; }
.glow { position: absolute; border-radius: 50%; filter: blur(90px); }
.end h1 { margin: 26px 0 22px; font-size: 128px; line-height: .98; font-weight: 500; letter-spacing: -0.055em; }
.end h1 span { display: inline-block; padding: 0 .14em .04em; border-radius: .26em; background: var(--grass); color: #2c2e2a; }
.end p { margin: 0; font-size: 36px; color: #c8d6f0; }
.mark { display: flex; align-items: center; gap: 22px; font-size: 52px; font-weight: 600; letter-spacing: -0.02em; }
.mark img { width: 92px; height: 92px; }
.tagc { display: inline-flex; align-items: center; gap: 14px; margin-top: 40px; padding: 12px 26px; border-radius: 99px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); font-size: 28px; }
.tagc::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #f5e211; }
.qr { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px; border-radius: 44px; background: #fff; color: #2c2e2a; font-size: 30px; font-weight: 500; }
.qr img { width: 330px; height: 330px; }

/* ---------- 16:9 framed version ---------- */
.stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: radial-gradient(120% 95% at 72% 0%, #1b4590 0%, #112f6b 38%, #0b1e45 72%, #08163a 100%); display: grid; grid-template-columns: 1fr 520px; align-items: center; gap: 120px; padding: 0 220px; color: #fff; }
.stage .cap small { display: inline-flex; align-items: center; gap: 12px; padding: 10px 22px; border-radius: 99px; background: rgba(255,255,255,.1); font-size: 26px; color: #dbe6fb; }
.stage .cap small::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--grass); }
.stage .cap h2 { margin: 28px 0 0; font-size: 92px; line-height: 1; font-weight: 500; letter-spacing: -0.05em; }
.stage .cap p { margin: 26px 0 0; max-width: 18em; font-size: 34px; line-height: 1.4; color: #c8d6f0; }
.phone { position: relative; width: 420px; height: 910px; margin-top: 10px; padding: 14px; border-radius: 70px; background: linear-gradient(150deg, #5b5e57, #1b1d1a 18%, #121311 60%, #3d403a); box-shadow: inset 0 0 0 2px #6d7068, inset 0 0 0 6px #1b1d1a; transform: rotate(-3deg); }
.phone__in { width: 392px; height: 882px; overflow: hidden; border-radius: 56px; }
.phone__in .screen { transform: scale(1.0889); transform-origin: 0 0; }
</style>
</head>

    share: ["Сцена 5", "На iPhone — через «Поделиться»", "Фото или ссылку отправляешь в SafeChilds."],
    message: ["Сцена 6", "Готовые слова для взрослого", "Одно нажатие — и мама знает, что нужна помощь."]
  };
  var q = new URLSearchParams(location.search), s = q.get("s") || "dm", frame = q.get("frame") === "1";
  var tpl = document.getElementById("s-" + s), root = document.getElementById("root");
  var node = tpl.content.cloneNode(true);
  var scr = node.querySelector(".screen");
  if (scr) scr.prepend(document.getElementById("t-status").content.cloneNode(true));
  if (frame && scr) {
    var c = CAPS[s] || ["", "", ""];
    root.innerHTML = '<div class="stage"><div class="cap"><small>' + c[0] + '</small><h2>' + c[1] + '</h2><p>' + c[2] + '</p></div><div class="phone"><div class="phone__in"></div></div></div>';
    root.querySelector(".phone__in").appendChild(node);
  } else {
    root.appendChild(node);
  }
</script>
